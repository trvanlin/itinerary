<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itinerary</title>
  <link rel="icon" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#3b82f6">
  <style>
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #1f2937;
      --border: #30363d;
      --text: #e6edf3;
      --text2: #8b949e;
      --text3: #6e7681;
      --flight: #3b82f6;
      --hotel: #f59e0b;
      --car: #10b981;
      --activity: #a78bfa;
      --restaurant: #f472b6;
      --note: #64748b;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,17,23,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      white-space: nowrap;
    }
    .logo span { color: var(--flight); }

    /* ── Back button / detail header ── */
    .back-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--flight);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
      white-space: nowrap;
    }
    .back-btn svg { flex-shrink: 0; }
    .header-trip-name {
      display: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-left: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      background: var(--bg);
      position: sticky;
      top: 53px;
      z-index: 90;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text2);
      font-size: 14px;
      font-weight: 500;
      padding: 11px 14px;
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
    }
    .tab-btn.active { color: var(--text); font-weight: 600; }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 2px;
      background: var(--flight);
      border-radius: 2px 2px 0 0;
    }
    .tab-count {
      display: inline-block;
      background: var(--bg3);
      color: var(--text3);
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 5px;
      vertical-align: middle;
    }

    /* ── Trip cards ── */
    .trip-list {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }
    .year-header {
      position: sticky;
      top: 143px;
      z-index: 80;
      background: var(--bg);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text2);
      padding: 16px 0 8px;
      margin-top: 6px;
      border-bottom: 1px solid var(--border);
    }
    .year-header:first-child { margin-top: 0; }
    .trip-card {
      display: flex;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .trip-card:hover { border-color: var(--card-type, var(--card-accent, var(--border))); transform: translateY(-1px); }
    .trip-card:active { transform: translateY(0); opacity: 0.85; }
    .card-stripe { width: 4px; background: var(--card-type, var(--card-accent, var(--flight))); flex-shrink: 0; }
    .card-body { flex: 1; padding: 14px 16px; min-width: 0; }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    .card-name { font-size: 17px; font-weight: 700; line-height: 1.2; }
    .card-sub   { font-size: 13px; color: var(--text2); margin-top: 1px; }
    .card-dest  { font-size: 12px; color: var(--text3); margin-top: 1px; }
    .card-dates { font-size: 13px; color: var(--text2); margin-top: 3px; }
    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .card-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--card-type, var(--card-accent, var(--flight)));
      background: color-mix(in srgb, var(--card-type, var(--card-accent, var(--flight))) 13%, transparent);
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .card-pills { display: flex; gap: 10px; flex-wrap: wrap; }
    .card-pill  { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 3px; }

    .empty-tab { text-align: center; padding: 60px 24px; color: var(--text3); font-size: 14px; }

    .ext-link {
      color: var(--text2);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.15s;
    }
    .ext-link:hover { color: var(--text); }

    /* ── Hero ── */
    .trip-hero {
      padding: 40px 24px 32px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
    }
    .trip-hero .trip-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent, var(--flight));
      margin-bottom: 8px;
    }
    .hero-badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--type-color, var(--flight));
      background: color-mix(in srgb, var(--type-color, var(--flight)) 13%, transparent);
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .trip-hero h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }
    .trip-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      color: var(--text2);
      font-size: 14px;
    }
    .trip-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .trip-meta-item svg { opacity: 0.7; }

    /* ── Timeline ── */
    .timeline {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .day-group { margin-bottom: 36px; }
    .day-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .day-date {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text2);
      white-space: nowrap;
    }
    .day-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .day-dow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text3);
      white-space: nowrap;
    }

    /* ── Segment cards ── */
    .segment {
      display: flex;
      gap: 14px;
      margin-bottom: 10px;
      position: relative;
    }
    .seg-icon-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 36px;
      flex-shrink: 0;
    }
    .seg-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .seg-line {
      width: 2px;
      flex: 1;
      min-height: 10px;
      background: var(--border);
      margin-top: 4px;
    }
    .segment:last-child .seg-line { display: none; }

    .seg-card {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 4px;
      transition: border-color 0.15s;
    }
    .seg-card:hover { border-color: var(--seg-color, var(--border)); }

    .seg-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .seg-type-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--seg-color, var(--text2));
      background: color-mix(in srgb, var(--seg-color, #888) 12%, transparent);
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .seg-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      flex: 1;
    }
    .seg-time {
      font-size: 13px;
      color: var(--text2);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Flight-specific */
    .flight-route {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .flight-airport {
      text-align: center;
    }
    .flight-airport .code {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .flight-airport .city {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
    }
    .flight-airport .time {
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
    }
    .flight-arrow {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .flight-arrow .duration {
      font-size: 11px;
      color: var(--text3);
    }
    .flight-arrow .line {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--flight) 0%, var(--flight) 100%);
      position: relative;
    }
    .flight-arrow .line::after {
      content: '▶';
      position: absolute;
      right: -4px;
      top: -7px;
      font-size: 9px;
      color: var(--flight);
    }

    /* Hotel-specific */
    .hotel-nights {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text2);
      background: var(--bg3);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    /* Details row */
    .seg-details {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: 13px;
      color: var(--text2);
    }
    .seg-detail {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .seg-detail-label {
      color: var(--text3);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .confirmation {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--seg-color, var(--text));
      background: color-mix(in srgb, var(--seg-color, #888) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--seg-color, #888) 25%, transparent);
      padding: 3px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: opacity 0.1s;
      text-decoration: none;
      user-select: none;
    }
    .confirmation:hover { opacity: 0.8; }
    .confirmation.copied::after { content: ' ✓'; font-size: 11px; }

    .seg-notes {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text2);
      background: var(--bg3);
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 2px solid var(--seg-color, var(--border));
    }

    /* ── Type filter ── */
    :root {
      --type-work:     #FFB612;
      --type-personal: #2d9e5a;
    }
    .type-filter {
      display: flex;
      gap: 8px;
      padding: 10px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 95px;
      z-index: 85;
    }
    .type-btn {
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .type-btn.active[data-type="all"]      { color: var(--text); background: var(--bg3); border-color: var(--text3); }
    .type-btn.active[data-type="work"]     { color: var(--type-work);     background: color-mix(in srgb, var(--type-work)     12%, transparent); border-color: var(--type-work); }
    .type-btn.active[data-type="personal"] { color: var(--type-personal); background: color-mix(in srgb, var(--type-personal) 12%, transparent); border-color: var(--type-personal); }

    .card-type-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 2px 7px;
      border-radius: 4px;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--text3);
    }
    .empty h2 { font-size: 20px; color: var(--text2); margin-bottom: 8px; }

    /* Responsive */
    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      .trip-hero { padding: 28px 16px 24px; }
      .trip-hero h1 { font-size: 26px; }
      .timeline { padding: 24px 16px 60px; }
      .flight-airport .code { font-size: 18px; }
    }

    /* ── Stats ── */
    .stats-view {
      padding: 20px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .stat-tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat-tile {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .stat-tile-icon { font-size: 20px; margin-bottom: 8px; display: block; }
    .stat-tile-value {
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }
    .stat-tile-label {
      font-size: 11px;
      color: var(--text2);
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .stat-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .stat-card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .bar-label {
      font-size: 12px;
      color: var(--text);
      min-width: 90px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      flex: 1;
      height: 6px;
      background: var(--bg3);
      border-radius: 3px;
      overflow: hidden;
      min-width: 40px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.75s cubic-bezier(0.4,0,0.2,1);
    }
    .bar-value {
      font-size: 12px;
      color: var(--text2);
      min-width: 60px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .stat-sub {
      font-size: 11px;
      color: var(--text3);
      margin-top: 10px;
      line-height: 1.5;
    }
    .us-map {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(9, 1fr);
      gap: 3px;
      aspect-ratio: 12 / 9;
      margin-bottom: 14px;
    }
    .state-tile {
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2px;
      transition: transform 0.15s;
      cursor: default;
      user-select: none;
    }
    .state-tile.visited {
      background: rgba(255,182,18,0.18);
      color: #FFB612;
      border: 1px solid rgba(255,182,18,0.45);
    }
    .state-tile.visited:hover { transform: scale(1.2); }
    .state-tile.unvisited {
      background: var(--bg3);
      color: var(--text3);
    }
    .visited-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .visited-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255,182,18,0.15);
      color: #FFB612;
      border: 1px solid rgba(255,182,18,0.3);
    }
    @media (max-width: 600px) {
      .stat-tiles { grid-template-columns: repeat(2, 1fr); }
      .stat-two-col { grid-template-columns: 1fr; }
      .stat-tile-value { font-size: 24px; }
    }
  </style>
</head>
<body>

<header>
  <button class="back-btn" id="backBtn" onclick="showHome()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>

</header>
<div class="tab-bar" id="tabBar">
  <button class="tab-btn active" id="tabUpcoming" onclick="switchTab('upcoming')">Current Trips <span class="tab-count" id="countUpcoming"></span></button>
  <button class="tab-btn" id="tabArchive" onclick="switchTab('archive')">Past Trips <span class="tab-count" id="countArchive"></span></button>

</div>

<div class="type-filter" id="typeFilter">
  <button class="type-btn active" data-type="all"      onclick="switchFilter('all')">All</button>
  <button class="type-btn"        data-type="work"     onclick="switchFilter('work')">Work</button>
  <button class="type-btn"        data-type="personal" onclick="switchFilter('personal')">Personal</button>
</div>

<div id="app"></div>

<script>
const TRIPS = JSON.parse(document.getElementById('trip-data').textContent);

const ICONS = {
  flight: '✈',
  hotel: '🏨',
  car: '🚗',
  activity: '🎯',
  restaurant: '🍽',
  note: '📝'
};

const COLORS = {
  flight: 'var(--flight)',
  hotel: 'var(--hotel)',
  car: 'var(--car)',
  activity: 'var(--activity)',
  restaurant: 'var(--restaurant)',
  note: 'var(--note)'
};

const LABELS = {
  flight: 'Flight',
  hotel: 'Hotel',
  car: 'Rental Car',
  activity: 'Activity',
  restaurant: 'Restaurant',
  note: 'Note'
};

function formatDate(str) {
  const d = new Date(str + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatDateShort(str) {
  const d = new Date(str + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDateDOW(str) {
  const d = new Date(str + 'T12:00:00');
  const dow = d.toLocaleDateString('en-US', { weekday: 'short' });
  const m   = d.getMonth() + 1;
  const day = d.getDate();
  const yr  = String(d.getFullYear()).slice(-2);
  return `${dow} ${m}/${day}/${yr}`;
}

function formatDOW(str) {
  const d = new Date(str + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long' });
}

function nightsText(n) {
  return `${n} night${n !== 1 ? 's' : ''}`;
}

function mapsUrl(address) {
  return `https://maps.google.com/?q=${encodeURIComponent(address)}`;
}


function copyConfirmation(el, code) {
  navigator.clipboard.writeText(code).then(() => {
    el.classList.add('copied');
    setTimeout(() => el.classList.remove('copied'), 1500);
  });
}

function renderConfirmation(code, color) {
  if (!code) return '';
  return `<span class="confirmation" style="--seg-color:${color}" onclick="copyConfirmation(this,'${code.replace(/'/g,"\\'")}')">
    # ${code}
  </span>`;
}

function renderFlight(seg, color) {
  const fUrl = seg.flightyUrl;
  return `
    <div class="flight-route">
      <div class="flight-airport">
        <div class="code">${seg.from.code}</div>
        <div class="city">${seg.from.city}</div>
        <div class="time">${seg.from.time || ''}</div>
      </div>
      <div class="flight-arrow">
        <div class="duration">${seg.duration || ''}</div>
        <div class="line"></div>
      </div>
      <div class="flight-airport" style="text-align:right">
        <div class="code">${seg.to.code}</div>
        <div class="city">${seg.to.city}</div>
        <div class="time">${seg.to.time || ''}</div>
      </div>
    </div>
    <div class="seg-details">
      <div class="seg-detail"><span class="seg-detail-label">Flight</span> ${seg.flightNumber}</div>
      ${seg.class ? `<div class="seg-detail"><span class="seg-detail-label">Class</span> ${seg.class}</div>` : ''}
      ${seg.seat ? `<div class="seg-detail"><span class="seg-detail-label">Seat</span> ${seg.seat}</div>` : ''}
      ${seg.from.terminal ? `<div class="seg-detail"><span class="seg-detail-label">Terminal</span> ${seg.from.terminal}</div>` : ''}
      ${seg.from.gate ? `<div class="seg-detail"><span class="seg-detail-label">Gate</span> ${seg.from.gate}</div>` : ''}
    </div>
    ${fUrl ? `<div style="margin-top:10px"><a href="${fUrl}" target="_blank" class="ext-link">Flighty ↗</a></div>` : ''}
  `;
}

function renderHotel(seg, color) {
  return `
    ${seg.nights ? `<div class="hotel-nights">🌙 ${nightsText(seg.nights)} · Check-out ${formatDateShort(seg.checkOut)}</div>` : ''}
    <div class="seg-details">
      ${seg.address ? `<div class="seg-detail"><span class="seg-detail-label">Address</span> <a href="${mapsUrl(seg.address)}" target="_blank" class="ext-link">${seg.address} ↗</a></div>` : ''}
      ${seg.roomType ? `<div class="seg-detail"><span class="seg-detail-label">Room</span> ${seg.roomType}</div>` : ''}
      ${seg.phone ? `<div class="seg-detail"><span class="seg-detail-label">Phone</span> ${seg.phone}</div>` : ''}
    </div>
  `;
}

function renderCar(seg, color) {
  const pickupLink  = seg.pickup.address  ? `<a href="${mapsUrl(seg.pickup.address)}"  target="_blank" class="ext-link">${seg.pickup.location} ↗</a>`  : seg.pickup.location;
  const dropoffLink = seg.dropoff.address ? `<a href="${mapsUrl(seg.dropoff.address)}" target="_blank" class="ext-link">${seg.dropoff.location} ↗</a>` : seg.dropoff.location;
  return `
    <div class="seg-details">
      <div class="seg-detail"><span class="seg-detail-label">Pickup</span> ${pickupLink}${seg.pickup.time ? ' at ' + seg.pickup.time : ''}</div>
      <div class="seg-detail"><span class="seg-detail-label">Drop-off</span> ${dropoffLink}${seg.dropoff.time ? ' at ' + seg.dropoff.time + (seg.dropoff.date ? ' on ' + formatDateShort(seg.dropoff.date) : '') : ''}</div>
      ${seg.class ? `<div class="seg-detail"><span class="seg-detail-label">Class</span> ${seg.class}</div>` : ''}
    </div>
  `;
}

function renderActivity(seg, color) {
  return `
    <div class="seg-details">
      ${seg.address ? `<div class="seg-detail"><span class="seg-detail-label">Location</span> ${seg.address}</div>` : ''}
      ${seg.duration ? `<div class="seg-detail"><span class="seg-detail-label">Duration</span> ${seg.duration}</div>` : ''}
    </div>
  `;
}

function renderRestaurant(seg, color) {
  return `
    <div class="seg-details">
      ${seg.address ? `<div class="seg-detail"><span class="seg-detail-label">Address</span> ${seg.address}</div>` : ''}
      ${seg.phone ? `<div class="seg-detail"><span class="seg-detail-label">Phone</span> ${seg.phone}</div>` : ''}
    </div>
  `;
}

function renderSegment(seg) {
  const color = COLORS[seg.type] || 'var(--text2)';
  const icon = ICONS[seg.type] || '•';
  const label = LABELS[seg.type] || seg.type;

  let titleHTML = '';
  let bodyHTML = '';
  let timeHTML = '';

  switch (seg.type) {
    case 'flight':
      titleHTML = `${seg.airline} · ${seg.flightNumber}`;
      timeHTML = seg.from?.time || '';
      bodyHTML = renderFlight(seg, color);
      break;
    case 'hotel':
      titleHTML = seg.name;
      timeHTML = `Check-in`;
      bodyHTML = renderHotel(seg, color);
      break;
    case 'car':
      titleHTML = seg.company;
      timeHTML = seg.pickup?.time || '';
      bodyHTML = renderCar(seg, color);
      break;
    case 'activity':
      titleHTML = seg.name;
      timeHTML = seg.time || '';
      bodyHTML = renderActivity(seg, color);
      break;
    case 'restaurant':
      titleHTML = seg.name;
      timeHTML = seg.time || '';
      bodyHTML = renderRestaurant(seg, color);
      break;
    case 'note':
      titleHTML = seg.title || 'Note';
      timeHTML = '';
      bodyHTML = '';
      break;
  }

  const conf = renderConfirmation(seg.confirmation, color);
  const notes = seg.notes ? `<div class="seg-notes">${seg.notes}</div>` : '';

  return `
    <div class="segment">
      <div class="seg-icon-col">
        <div class="seg-icon" style="background:color-mix(in srgb,${color} 15%,transparent);color:${color}">${icon}</div>
        <div class="seg-line"></div>
      </div>
      <div class="seg-card" style="--seg-color:${color}">
        <div class="seg-top">
          <div class="seg-type-badge" style="--seg-color:${color}">${label}</div>
          <div class="seg-title">${titleHTML}</div>
          ${timeHTML ? `<div class="seg-time">${timeHTML}</div>` : ''}
        </div>
        ${bodyHTML}
        ${conf ? `<div style="margin-top:10px">${conf}</div>` : ''}
        ${notes}
      </div>
    </div>
  `;
}

function groupByDay(segments) {
  const days = {};
  segments.forEach(seg => {
    const d = seg.date;
    if (!days[d]) days[d] = [];
    days[d].push(seg);
  });
  return Object.entries(days).sort(([a], [b]) => a.localeCompare(b));
}

function renderTrip(trip) {
  const days = groupByDay(trip.segments);
  const typeColor = TYPE_COLOR[trip.type] || trip.accent || '#3b82f6';

  const d = daysUntil(trip.dates.start);
  const past = isArchived(trip);
  let heroBadge;
  if (past) {
    const ago = Math.abs(daysUntil(trip.dates.end));
    heroBadge = ago === 0 ? 'Just ended' : `${ago}d ago`;
  } else if (d < 0) {
    heroBadge = 'In progress';
  } else if (d === 0) {
    heroBadge = 'Today!';
  } else if (d === 1) {
    heroBadge = 'Tomorrow';
  } else {
    heroBadge = `${d} days away`;
  }

  const heroHTML = `
    <div class="trip-hero" style="border-left: 4px solid ${typeColor}; padding-left: 28px;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div class="trip-label" style="--accent:${typeColor}">${trip.destination || ''}</div>
        <div class="hero-badge" style="--type-color:${typeColor}">${heroBadge}</div>
      </div>
      <h1>${trip.name}${trip.icon ? ` ${trip.icon}` : ''}${trip.subtitle ? ` <span style="font-weight:400;color:var(--text2)">${trip.subtitle}</span>` : ''}</h1>
      <div class="trip-meta">
        <div class="trip-meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          ${formatDateDOW(trip.dates.start)} – ${formatDateDOW(trip.dates.end)}
        </div>
        ${trip.travelers?.length ? `<div class="trip-meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          ${trip.travelers.join(', ')}
        </div>` : ''}
      </div>
    </div>
  `;

  const timelineHTML = days.map(([date, segs]) => `
    <div class="day-group">
      <div class="day-header">
        <div class="day-date">${formatDateShort(date)}</div>
        <div class="day-line"></div>
        <div class="day-dow">${formatDOW(date)}</div>
      </div>
      ${segs.map(renderSegment).join('')}
    </div>
  `).join('');

  return heroHTML + `<div class="timeline">${timelineHTML}</div>`;
}

function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.ceil((new Date(dateStr + 'T00:00:00') - today) / 86400000);
}

function isArchived(trip) {
  return new Date(trip.dates.end + 'T23:59:59') < new Date();
}

function renderTripCard(trip) {
  const accent = trip.accent || '#3b82f6';
  const days = daysUntil(trip.dates.start);
  const past = isArchived(trip);

  let badge;
  if (past) {
    const ago = Math.abs(daysUntil(trip.dates.end));
    badge = ago === 0 ? 'Just ended' : `${ago}d ago`;
  } else if (days < 0) {
    badge = 'In progress';
  } else if (days === 0) {
    badge = 'Today';
  } else if (days === 1) {
    badge = 'Tomorrow';
  } else {
    badge = `${days} days`;
  }

  const counts = {};
  trip.segments.forEach(s => { if (s.type !== 'note') counts[s.type] = (counts[s.type]||0)+1; });
  const AIRLINE_ABBR = { Southwest: 'SW', United: 'UA', Alaska: 'AS', Delta: 'DL', American: 'AA', JetBlue: 'B6', Frontier: 'F9', Spirit: 'NK', Hawaiian: 'HA' };
  const airlines = [...new Set(trip.segments.filter(s => s.type === 'flight' && s.airline).map(s => AIRLINE_ABBR[s.airline] || s.airline))];
  const pills = Object.entries(counts)
    .map(([t,n]) => {
      const suffix = t === 'flight' && airlines.length ? ` <span style="opacity:0.55;font-size:10.5px;letter-spacing:0.02em">· ${airlines.join(' · ')}</span>` : '';
      return `<span class="card-pill">${ICONS[t]} ${n}${suffix}</span>`;
    }).join('');

  return `
    <div class="trip-card" style="--card-accent:${accent};--card-type:${TYPE_COLOR[trip.type]||accent}" onclick="showTrip('${trip.id}')">
      <div class="card-stripe"></div>
      <div class="card-body">
        <div class="card-top">
          <div>
            <div class="card-name">${trip.name}${trip.icon ? ` ${trip.icon}` : ''}</div>
            ${trip.subtitle ? `<div class="card-sub">${trip.subtitle}</div>` : ''}
            ${trip.destination ? `<div class="card-dest">${trip.destination}</div>` : ''}
            <div class="card-dates">${formatDateDOW(trip.dates.start)} – ${formatDateDOW(trip.dates.end)}</div>
          </div>
          <div class="card-right">
            <div class="card-badge">${badge}</div>
            ${trip.type ? `<div class="card-type-pill" style="color:${TYPE_COLOR[trip.type]||'var(--text3)'};background:color-mix(in srgb,${TYPE_COLOR[trip.type]||'var(--text3)'} 12%,transparent)">${trip.type === 'work' ? 'Work' : 'Personal'}</div>` : ''}
            ${pills ? `<div class="card-pills">${pills}</div>` : ''}
          </div>
        </div>
      </div>
    </div>`;
}

let currentTab    = 'upcoming';
let currentFilter = 'all';

const TYPE_COLOR = { work: 'var(--type-work)', personal: 'var(--type-personal)' };

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabUpcoming').classList.toggle('active', tab === 'upcoming');
  document.getElementById('tabArchive').classList.toggle('active', tab === 'archive');
  document.getElementById('tabStats').classList.toggle('active', tab === 'stats');
  document.getElementById('typeFilter').style.display = tab === 'stats' ? 'none' : '';
  if (tab === 'stats') {
    document.getElementById('app').innerHTML = buildStatsHTML();
    requestAnimationFrame(() => requestAnimationFrame(animateBars));
  } else {
    renderHome();
  }
}

function switchFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.type === f);
  });
  renderHome();
}

function showHome() {
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('logoEl').style.display = '';
  document.getElementById('headerTripName').style.display = 'none';
  document.getElementById('tabBar').style.display = '';
  document.getElementById('typeFilter').style.display = currentTab === 'stats' ? 'none' : '';
  document.title = 'Itinerary';
  if (currentTab === 'stats') {
    document.getElementById('app').innerHTML = buildStatsHTML();
    requestAnimationFrame(() => requestAnimationFrame(animateBars));
  } else {
    renderHome();
  }
  window.scrollTo(0, 0);
}

function renderHome() {
  const byTab = {
    upcoming: TRIPS.filter(t => !isArchived(t)).sort((a,b) => a.dates.start.localeCompare(b.dates.start)),
    archive:  TRIPS.filter(t =>  isArchived(t)).sort((a,b) => b.dates.start.localeCompare(a.dates.start))
  };

  document.getElementById('countUpcoming').textContent = byTab.upcoming.length;
  document.getElementById('countArchive').textContent  = byTab.archive.length;

  const base = byTab[currentTab];
  const list = currentFilter === 'all' ? base : base.filter(t => t.type === currentFilter);

  let content;
  if (!list.length) {
    content = `<div class="empty-tab">${currentTab === 'upcoming' ? 'No current trips.' : 'No past trips yet.'}</div>`;
  } else if (currentTab === 'archive') {
    const byYear = {};
    list.forEach(t => { const yr = t.dates.start.substring(0, 4); (byYear[yr] = byYear[yr] || []).push(t); });
    const inner = Object.keys(byYear).sort((a, b) => b - a).map(yr =>
      `<div class="year-header">${yr}</div>${byYear[yr].map(renderTripCard).join('')}`
    ).join('');
    content = `<div class="trip-list">${inner}</div>`;
  } else {
    content = `<div class="trip-list">${list.map(renderTripCard).join('')}</div>`;
  }
  document.getElementById('app').innerHTML = content;
}

function showTrip(id) {
  const trip = TRIPS.find(t => t.id === id);
  if (!trip) return;
  document.getElementById('backBtn').style.display = 'flex';
  document.getElementById('logoEl').style.display = 'none';
  document.getElementById('headerTripName').textContent = trip.name + (trip.subtitle ? ' · ' + trip.subtitle : '');
  document.getElementById('headerTripName').style.display = 'block';
  document.getElementById('tabBar').style.display = 'none';
  document.getElementById('typeFilter').style.display = 'none';
  document.getElementById('app').innerHTML = renderTrip(trip);
  document.title = `${trip.name} · Itinerary`;
  window.scrollTo(0, 0);
}

function buildStatsHTML() {
  const HOME_AIRPORTS = ['SFO','SJC','OAK'];

  function routeKey(a, b) { return [a,b].sort().join('|'); }
  function routeDisplay(a, b) {
    if (HOME_AIRPORTS.includes(a)) return `${a}–${b}`;
    if (HOME_AIRPORTS.includes(b)) return `${b}–${a}`;
    return [a,b].sort().join('–');
  }
  function shortAC(s) { return s.replace(/^Boeing /,'').replace(/ Passenger$/,''); }

  const completed = TRIPS.filter(t => isArchived(t));

  const milesFlown = completed.reduce((s,t) => s + t.segments.filter(x=>x.type==='flight').reduce((ss,f)=>ss+(f.distance_mi||0),0), 0);
  const flightsFlown = completed.reduce((s,t) => s + t.segments.filter(x=>x.type==='flight').length, 0);

  // States from destination fields across all trips
  const visitedSet = new Set();
  TRIPS.forEach(t => {
    if (t.destination) {
      const m = t.destination.match(/,\s*([A-Z]{2})$/);
      if (m) visitedSet.add(m[1]);
    }
  });

  // Airlines (completed trips)
  const airlines = {};
  completed.forEach(t => t.segments.filter(x=>x.type==='flight').forEach(f => {
    const a = f.airline || 'Other';
    if (!airlines[a]) airlines[a] = {count:0, miles:0};
    airlines[a].count++; airlines[a].miles += f.distance_mi||0;
  }));
  const airlineColors = { United:'#3b82f6', Southwest:'#f59e0b' };
  const airlinesSorted = Object.entries(airlines).sort((a,b)=>b[1].miles-a[1].miles);
  const maxAirMiles = Math.max(1,...airlinesSorted.map(([,v])=>v.miles));

  // Routes (completed)
  const routes = {};
  completed.forEach(t => t.segments.filter(x=>x.type==='flight').forEach(f => {
    const k = routeKey(f.from.code, f.to.code);
    const disp = routeDisplay(f.from.code, f.to.code);
    if (!routes[k]) routes[k] = {count:0, disp};
    routes[k].count++;
  }));
  const routesSorted = Object.values(routes).sort((a,b)=>b.count-a.count).slice(0,8);
  const maxRoute = Math.max(1,...routesSorted.map(r=>r.count));

  // Aircraft (completed)
  const aircraft = {};
  completed.forEach(t => t.segments.filter(x=>x.type==='flight').forEach(f => {
    if (f.aircraft) {
      const a = shortAC(f.aircraft);
      aircraft[a] = (aircraft[a]||0)+1;
    }
  }));
  const aircraftSorted = Object.entries(aircraft).sort((a,b)=>b[1]-a[1]);
  const maxAC = Math.max(1,...aircraftSorted.map(([,v])=>v));

  // Miles by year (completed)
  const years = {};
  completed.forEach(t => {
    const yr = t.dates.start.slice(0,4);
    t.segments.filter(x=>x.type==='flight').forEach(f => {
      years[yr] = (years[yr]||0) + (f.distance_mi||0);
    });
  });
  const yearsSorted = Object.entries(years).sort((a,b)=>b[0].localeCompare(a[0]));
  const maxYear = Math.max(1,...yearsSorted.map(([,v])=>v));

  // State tile grid [col, row] 1-indexed
  const STATE_POS = {
    AK:[1,1],ME:[12,1],
    WA:[1,2],MT:[2,2],ND:[3,2],MN:[4,2],WI:[6,2],MI:[7,2],VT:[11,2],NH:[12,2],
    OR:[1,3],ID:[2,3],SD:[3,3],IA:[5,3],IL:[6,3],IN:[7,3],OH:[8,3],PA:[9,3],NY:[10,3],MA:[11,3],RI:[12,3],
    NV:[2,4],WY:[3,4],NE:[4,4],MO:[5,4],KY:[6,4],WV:[7,4],VA:[8,4],MD:[9,4],NJ:[10,4],CT:[11,4],
    CA:[1,5],UT:[3,5],CO:[4,5],KS:[5,5],TN:[6,5],NC:[7,5],DC:[8,5],DE:[9,5],
    AZ:[3,6],NM:[4,6],OK:[5,6],AR:[6,6],SC:[7,6],GA:[8,6],
    TX:[4,7],LA:[5,7],MS:[6,7],AL:[7,7],
    FL:[8,8],HI:[1,9]
  };

  const stateGridHTML = Object.entries(STATE_POS).map(([st,[col,row]]) =>
    `<div class="state-tile ${visitedSet.has(st)?'visited':'unvisited'}" style="grid-column:${col};grid-row:${row}">${st}</div>`
  ).join('');

  function barRow(label, val, maxVal, color, suffix='') {
    const pct = Math.round((val/maxVal)*100);
    return `<div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track"><div class="bar-fill" data-width="${pct}" style="background:${color};width:0"></div></div>
      <div class="bar-value">${(typeof val==='number'?val.toLocaleString():val)}${suffix}</div>
    </div>`;
  }

  const visitedList = [...visitedSet].sort();

  return `<div class="stats-view">

  <div class="stat-tiles">
    <div class="stat-tile" style="border-top:3px solid #3b82f6">
      <span class="stat-tile-icon">✈</span>
      <div class="stat-tile-value" style="color:#3b82f6">${milesFlown.toLocaleString()}</div>
      <div class="stat-tile-label">Miles Flown</div>
    </div>
    <div class="stat-tile" style="border-top:3px solid #FFB612">
      <span class="stat-tile-icon">🛫</span>
      <div class="stat-tile-value" style="color:#FFB612">${flightsFlown}</div>
      <div class="stat-tile-label">Flights Taken</div>
    </div>
    <div class="stat-tile" style="border-top:3px solid #10b981">
      <span class="stat-tile-icon">🗂</span>
      <div class="stat-tile-value" style="color:#10b981">${completed.length}</div>
      <div class="stat-tile-label">Trips Completed</div>
    </div>
    <div class="stat-tile" style="border-top:3px solid #a78bfa">
      <span class="stat-tile-icon">📍</span>
      <div class="stat-tile-value" style="color:#a78bfa">${visitedList.length}</div>
      <div class="stat-tile-label">States Visited</div>
    </div>
  </div>

  <div class="stat-two-col">
    <div class="stat-card">
      <div class="stat-card-title">Top Routes</div>
      ${routesSorted.map(r => barRow(r.disp, r.count, maxRoute, '#3b82f6', r.count===1?' flight':' flights')).join('')}
    </div>
    <div class="stat-card">
      <div class="stat-card-title">Airlines</div>
      ${airlinesSorted.map(([name,d]) => barRow(name, d.miles, maxAirMiles, airlineColors[name]||'#a78bfa', ' mi')).join('')}
      <div class="stat-sub">${airlinesSorted.map(([n,d]) => `${n}: ${d.count} ${d.count===1?'flight':'flights'}`).join(' · ')}</div>
    </div>
  </div>

  <div class="stat-two-col">
    <div class="stat-card">
      <div class="stat-card-title">Aircraft Fleet</div>
      ${aircraftSorted.map(([name,cnt]) => barRow(name, cnt, maxAC, '#10b981', cnt===1?' flight':' flights')).join('')}
    </div>
    <div class="stat-card">
      <div class="stat-card-title">Miles by Year</div>
      ${yearsSorted.map(([yr,mi]) => barRow(yr, mi, maxYear, '#FFB612', ' mi')).join('')}
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-card-title">States Visited · ${visitedList.length} of 50 + DC</div>
    <div class="us-map">${stateGridHTML}</div>
    <div class="visited-badges">${visitedList.map(s=>`<span class="visited-badge">${s}</span>`).join('')}</div>
  </div>

</div>`;
}

function animateBars() {
  document.querySelectorAll('.bar-fill[data-width]').forEach(el => {
    el.style.width = el.dataset.width + '%';
  });
}

function init() {
  if (!TRIPS.length) {
    document.getElementById('app').innerHTML = `<div class="empty-tab">No trips yet.</div>`;
    return;
  }
  showHome();
}

init();
</script>
</body>
</html>
